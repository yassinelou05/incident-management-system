spring.application.name=incident-management-system
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/incident_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
application.data.initialize=${DEMO_DATA_ENABLED:false}
application.demo.password=${DEMO_PASSWORD:}
application.accounts.temporary-password=${TEMPORARY_ACCOUNT_PASSWORD}
