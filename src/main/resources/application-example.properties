# Reference only: the normal application.properties reads these environment variables.
# Keep real values outside this repository. Do not activate an "example" profile.
spring.datasource.url=jdbc:mysql://localhost:3306/incident_management
spring.datasource.username=YOUR_DATABASE_USER
spring.datasource.password=YOUR_DATABASE_PASSWORD
application.security.jwt.secret-key=YOUR_RANDOM_BASE64_KEY_AT_LEAST_32_BYTES
application.accounts.temporary-password=YOUR_LOCAL_TEMPORARY_ACCOUNT_PASSWORD
application.data.initialize=false
application.demo.password=YOUR_LOCAL_DEMO_PASSWORD
application.cors.allowed-origins=http://localhost:3000
